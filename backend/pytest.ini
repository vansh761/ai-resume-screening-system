[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast, isolated tests with no external dependencies
    integration: tests that hit a real DB/Redis/API
    llm_integration: tests that hit the real Gemini API, cost quota, and require GEMINI_API_KEY
addopts = -v --tb=short
